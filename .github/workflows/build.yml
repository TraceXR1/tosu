name: Build executables

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_script: build:linux
            binary_name: tosu
            archive_name: tosu--linux-x64.tar.gz

          - os: windows-latest
            build_script: build:win
            binary_name: tosu.exe
            archive_name: tosu--win-x64.zip
    
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    name: Build for ${{ matrix.os }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build executable
        run: |
          echo "Building for ${{ matrix.os }}"
          pnpm run ${{ matrix.build_script }}

      - name: Archive Executable
        run: |
          cd tosu/dist
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "../../${{ matrix.archive_name }}" "${{ matrix.binary_name }}"
          else
            tar -czvf "../../${{ matrix.archive_name }}" "${{ matrix.binary_name }}"
          fi

      - name: Upload Release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
